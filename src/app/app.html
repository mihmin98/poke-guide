<a class="skip-link" href="#main">Skip to content</a>

<mat-toolbar class="top-bar">
  <a class="brand" routerLink="/games">Poké Guide</a>
  @if (game(); as g) {
    <a
      class="game-chip"
      routerLink="/games"
      [attr.aria-label]="'Game: ' + g.name + '. Change game'"
    >
      {{ g.shortName }}
    </a>
  }
</mat-toolbar>

<div class="layout">
  <nav class="nav" aria-label="Main">
    @for (item of navItems(); track item.label) {
      <a
        class="nav-item"
        [class.active]="item.active"
        [routerLink]="item.link"
        [attr.aria-current]="item.active ? 'page' : null"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
    <button type="button" class="nav-item" [class.active]="moreActive()" [matMenuTriggerFor]="more">
      <mat-icon aria-hidden="true">more_horiz</mat-icon>
      <span>More</span>
    </button>
  </nav>

  <main id="main" tabindex="-1">
    <router-outlet />
    <footer class="attribution">
      Encounter data from
      <a href="https://bulbapedia.bulbagarden.net/" rel="noopener" target="_blank">Bulbapedia</a>,
      the community-driven Pokémon encyclopedia (CC BY-NC-SA 2.5).
      <a routerLink="/about">About</a>
    </footer>
  </main>
</div>

<mat-menu #more="matMenu">
  <a mat-menu-item routerLink="/games">
    <mat-icon aria-hidden="true">sports_esports</mat-icon>
    <span>Games</span>
  </a>
  <a mat-menu-item routerLink="/settings">
    <mat-icon aria-hidden="true">settings</mat-icon>
    <span>Settings</span>
  </a>
  <a mat-menu-item routerLink="/about">
    <mat-icon aria-hidden="true">info</mat-icon>
    <span>About</span>
  </a>
</mat-menu>
