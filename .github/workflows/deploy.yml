# Builds and publishes the app to GitHub Pages (plan §17): https://mihmin98.github.io/poke-guide/
# Runs on release tags only (plan §17.1), so the live site is always a tagged version. It runs the full
# quality gate first, so a failing check never goes live. A manual run must be started from a release tag
# too ("Use workflow from" → Tags).
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued one waits rather than cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site lives under /<repo>/. A custom domain would mean adding public/CNAME and using '/'.
  PAGES_BASE_HREF: /poke-guide/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tag must name the version in package.json, which the app shows and the update prompt reads.
      - name: Check the release tag
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Deploy runs from the release tag $expected, not $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run data:validate
      - run: npx ng build --base-href "$PAGES_BASE_HREF"
      # Pages serves 404.html for unknown paths, so deep links load the app; .nojekyll skips Jekyll.
      - run: |
          cp dist/poke-guide/browser/index.html dist/poke-guide/browser/404.html
          touch dist/poke-guide/browser/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/poke-guide/browser
          include-hidden-files: true # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
